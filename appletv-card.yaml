type: custom:bubble-card
card_type: pop-up
hash: '#apple_tv'
tap_action:
  action: none
double_tap_action:
  action: none
hold_action:
  action: none
show_header: false
close_by_clicking_outside: true
button_type: name
styles: |
  #root {
    border: 1px solid rgba(var(--rgb-primary-text-color),0.1);
     
    }
sub_button:
  main: []
  bottom: []
cards:
  - type: custom:mushroom-chips-card
    chips:
      - type: template
        content: AppleTV
        double_tap_action:
          action: none
        tap_action:
          action: none
        hold_action:
          action: none
        icon: phu:apple-tv
      - type: spacer
      - type: template
        tap_action:
          action: none
        hold_action:
          action: none
        double_tap_action:
          action: none
        content: ''
        icon: mdi:sync-alert
        icon_color: >
          {% if states('media_player.gostinaia')  in ['unavailable','off',
          'standby'] and states('media_player.samsungtv') == 'off' %}
             0,0,0,0
           {% elif states('media_player.samsungtv') == 'on' and states('media_player.gostinaia') not in ['unavailable','off', 'standby'] %}
             0,0,0,0
           {% else %}
             red
           {% endif %}
      - type: conditional
        conditions:
          - condition: numeric_state
            entity_id: sensor.vremia_raboty_tv
            above: 0.016
        chip:
          type: template
          entity: sensor.vremia_raboty_tv
          content: |
            {% set total_raw_minutes = (states(entity) | float(0)) * 60 %}
            {% set whole_minutes = total_raw_minutes | int %}
            {% set fraction = total_raw_minutes - whole_minutes %}

            {% if fraction >= 0.9 %}
              {% set total_minutes = whole_minutes + 1 %}
            {% else %}
              {% set total_minutes = whole_minutes %}
            {% endif %}

            {% set days = total_minutes // 1440 %}
            {% set hours = (total_minutes % 1440) // 60 %}
            {% set minutes = total_minutes % 60 %}

            {% if total_minutes == 0 %}
              0 мин
            {% else %}
              {% if days > 0 %}{{ days }} д {% endif %}
              {% if hours > 0 %}{{ hours }} ч {% endif %}
              {% if minutes > 0 %}{{ minutes }} мин{% endif %}
            {% endif %}
          double_tap_action:
            action: none
          tap_action:
            action: more-info
          hold_action:
            action: none
          icon: |
            {% if states(entity)|int > 0 %}mdi:clock-check
            {% else %}mdi:clock-check-outline{% endif %}
          card_mod:
            style:
              .: |
                {% set hover = 'true' %}
                {% set stating = 'false' %}
                {% include 'chip_settings_style.jinja' %}
      - type: template
        entity: media_player.gostinaia
        double_tap_action:
          action: none
        tap_action:
          action: more-info
        hold_action:
          action: none
        icon: mdi:information
        card_mod:
          style:
            .: |
              {% set hover = 'true' %}
              {% set stating = 'false' %}
              {% include 'chip_settings_style.jinja' %}
      - type: back
        card_mod:
          style:
            .: |
              {% set hover = 'true' %}
              {% set stating = 'false' %}
              {% include 'chip_settings_style.jinja' %}
    card_mod:
      style:
        mushroom-back-chip:last-child$: |
          ha-state-icon {
            --card-mod-icon: mdi:close;
          }
        .: |
          {% include 'pop_up_title.jinja' %}
    grid_options:
      columns: 12
      rows: auto
  - type: custom:mini-media-player
    entity: media_player.gostinaia
    background: /local/cards_img/atv.png
    artwork: full-cover
    hide:
      name: true
      info: true
      controls: true
      source: true
      power: true
      volume: true
      progress: true
      icon: true
    toggle_power: false
    tap_action:
      action: none
    card_mod:
      style: |
        :host {
          --mini-media-player-overlay-color: transparent;
        }
        ha-card {
          aspect-ratio: 1 / 1;
          {% if is_state(config.entity, 'playing') %}
          {% else %}
          opacity: 0.4;
          {% endif %}
        }
  - type: custom:mushroom-template-card
    features_position: bottom
    entity: media_player.gostinaia
    grid_options:
      columns: 12
      rows: auto
    tap_action:
      action: none
    icon_tap_action:
      action: none
    primary: |-
      {% if states(config.entity) in  ['playing', 'paused']%} 
        {% if is_state_attr(config.entity, 'app_id', 'com.apple.TVAirPlay') and state_attr(config.entity, 'media_title') == '' %} 
        {{state_attr(config.entity, 'app_name')}}
        {% else %} 
                 {% if state_attr(config.entity, 'media_title') == '' %}Без названия
                 {% else %} {{ state_attr(config.entity, 'media_title')|replace("!⃝","🔞")}}
                 {% endif %}
        {% endif %}
        {% else %}  TV
      {% endif %}
    secondary: |
      {% if states(config.entity) in  ['playing', 'paused']%} 
        {% if is_state_attr(config.entity, 'app_id', 'ru.kinopoisk')%} Кинопоиск
        {% elif is_state_attr(config.entity, 'app_id', 'com.google.ios.youtube')%} YouTube
        {% elif is_state_attr(config.entity, 'app_id', 'com.apple.TVAirPlay')%} 
          {% if state_attr(config.entity, 'media_title') == '' %} Airplay
          {% else %} {{state_attr(config.entity, 'media_artist')}} 
          {% endif %}
        {% elif is_state_attr(config.entity, 'app_id', 'com.apple.TVWatchList')%} tv+
        {% elif is_state_attr(config.entity, 'app_id', 'com.apple.TVMusic')%}
                 {% if state_attr(config.entity, 'media_artist') == '' %} Music
                 {% else %} {{ state_attr(config.entity, 'media_artist')|truncate(100) }}
                 {% endif %}
        {% elif is_state_attr(config.entity, 'app_id', 'org.videolan.vlc-ios')%} VLC
        {% elif is_state_attr(config.entity, 'app_id', 'ru.ivi')%} Иви
        {% elif is_state_attr(config.entity, 'app_id', 'com.gruppainnova.films')%} {{state_attr(config.entity, 'media_artist')}} 
        {% else %} Воспроизведение
        {% endif %}

      {% elif is_state(config.entity, 'off')%} Сон
      {% else %} Бездействие
      {% endif %}
    card_mod:
      style: |
        ha-card {
          zoom: 1.5;
          background: none !important;
        }
  - type: conditional
    conditions:
      - condition: state
        entity: media_player.gostinaia
        state_not: unavailable
      - condition: state
        entity: binary_sensor.appletv_media_progress
        state: 'on'
    card:
      entity: media_player.homepod_mini_gost
      tap_action: none
      hide:
        icon: true
        name: true
        runtime: true
        source: true
        power: true
        state_label: true
        volume: true
        info: true
        progress: false
        controls: true
      more_info: false
      type: custom:mini-media-player
      toggle_power: false
      group: true
      volume_stateless: false
      card_mod:
        style:
          .: |
            ha-card {

              height: var(--mmp-progress-height);
              --mmp-accent-color: rgba(var(--rgb-primary-text-color),1);;
              --ha-card-border-width: 0;
              margin: 0px 15px; 
            }
  - type: custom:horizontal-stack-in-card
    cards:
      - type: custom:mushroom-template-card
        features_position: bottom
        entity: switch.apple_tv_switch
        grid_options:
          columns: 12
          rows: auto
        icon_tap_action:
          action: none
        icon: |-
          {% if is_state(config.entity, 'on')%}  mdi:power-off
          {% else %} mdi:power
          {% endif %}
        vertical: true
        tap_action:
          action: toggle
        color: white
        card_mod:
          style: |
            ha-card {
              zoom: 1.5;
              background: none !important;
            }
      - type: custom:mushroom-template-card
        features_position: bottom
        entity: media_player.gostinaia
        grid_options:
          columns: 12
          rows: auto
        icon: mdi:skip-previous
        tap_action:
          action: perform-action
          perform_action: media_player.media_previous_track
          target:
            entity_id: media_player.gostinaia
        vertical: true
        icon_tap_action:
          action: none
        color: |-
          {% if is_state('binary_sensor.appletv_media_progress','on')%} white
          {% else %} disabled
          {% endif %}
        card_mod:
          style: |
            ha-card {
              zoom: 1.5;
              background: none !important;
            }
      - type: custom:mushroom-template-card
        features_position: bottom
        entity: media_player.gostinaia
        grid_options:
          columns: 12
          rows: auto
        tap_action:
          action: perform-action
          perform_action: media_player.media_play_pause
          target:
            entity_id:
              - media_player.gostinaia
        vertical: true
        icon: |
          {% if is_state(entity, 'playing')%} fas:pause
          {% elif is_state(entity, 'paused')%} fas:play
          {% else %}fas:play{% endif%}
        color: |-
          {% if is_state('binary_sensor.appletv_media_progress','on')%} white
          {% else %} disabled
          {% endif %}
        card_mod:
          style: |
            ha-card {
              zoom: 1.5;
              background: none !important;
            }
      - type: custom:mushroom-template-card
        features_position: bottom
        entity: media_player.gostinaia
        grid_options:
          columns: 12
          rows: auto
        icon: mdi:skip-next
        tap_action:
          action: perform-action
          perform_action: media_player.media_next_track
          target:
            entity_id: media_player.gostinaia
        vertical: true
        icon_tap_action:
          action: none
        color: |-
          {% if is_state('binary_sensor.appletv_media_progress','on')%} white
          {% else %} disabled
          {% endif %}
        card_mod:
          style: |
            ha-card {
              zoom: 1.5;
              background: none !important;
            }
      - type: custom:mushroom-template-card
        features_position: bottom
        entity: light.embi_lampa
        grid_options:
          columns: 12
          rows: auto
        color: white
        tap_action:
          action: navigate
          navigation_path: '#apple_tv_remote'
        icon: phu:apple-tv-gen2-remote
        vertical: true
        icon_tap_action:
          action: none
        card_mod:
          style: |
            ha-card {
              zoom: 1.5;
              background: none !important;
            }
    card_mod:
      style: |
        ha-card {
          background: none !important;
        }
  - type: custom:mushroom-media-player-card
    entity: media_player.samsungtv
    volume_controls:
      - volume_set
    layout: horizontal
    primary_info: none
    secondary_info: none
    icon_type: none
    card_mod:
      style:
        mushroom-media-player-volume-control$: |
          mushroom-slider {
            --main-color: #505050 !important;
            --bg-color: #50505055 !important;
            --control-height: 25px !important;
          }
        .: |
          ha-card {
            background: transparent !important;
            opacity: 100%;
            margin: 0px 0px !important; 
            border-width: 0px;
            
          }
  - type: custom:mushroom-template-card
    features_position: bottom
    entity: input_boolean.appletv_muzyka
    grid_options:
      columns: 12
      rows: auto
    icon_tap_action:
      action: none
    icon: mdi:heart
    vertical: true
    tap_action:
      action: toggle
    color: white
    visibility:
      - condition: state
        entity: media_player.gostinaia
        state_not: unavailable
      - condition: state
        entity: media_player.gostinaia
        state_not: standby
      - condition: state
        entity: media_player.gostinaia
        state_not: 'off'
      - condition: state
        state_not: unavailable
    badge_color: pink
    card_mod:
      style: |
        ha-card {
          zoom: 1.5;
          background: none !important;
        }
popup_mode: fit-content
card_layout: large
slide_to_close_distance: '500'
with_bottom_offset: true
